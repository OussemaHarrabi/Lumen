[project]
name = "lumen_cv"
version = "0.1.0"
description = "Traitement d'images medicales conventionnel et profond pour Lumen"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pillow>=10.4",
  "onnxruntime>=1.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
