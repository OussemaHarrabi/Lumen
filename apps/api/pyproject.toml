[project]
name = "lumen_api"
version = "0.1.0"
description = "API Lumen"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "numpy>=2.0",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider -p no:platformdirs"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI attache les dependances dans les valeurs par defaut, c'est l'usage.
ignore = ["B008"]
